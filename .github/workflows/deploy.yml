name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      rebuild_migrate:
        description: Rebuild and publish the migrate image before deploy
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository }}
  MIGRATE_IMAGE_NAME: ${{ github.repository }}-migrate

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Test
        run: bun scripts/test-ci.ts

      - name: Build app bundle
        run: bun run build

  publish:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
    with:
      architecture: arm64
      rebuild_migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_migrate || false }}

  publish-amd64:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write
    with:
      architecture: amd64
      rebuild_migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_migrate || false }}

  publish-manifests:
    needs: [verify, publish, publish-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check current main revision
        id: revision
        run: |
          set -euo pipefail
          current=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            current=true
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.MIGRATE_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ steps.revision.outputs.current == 'true' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=ci-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Publish and verify multi-arch manifests
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
          ARM_APP_IMAGE: ${{ needs.publish.outputs.app_image }}
          AMD_APP_IMAGE: ${{ needs.publish-amd64.outputs.app_image }}
          ARM_MIGRATE_IMAGE: ${{ needs.publish.outputs.migrate_image }}
          AMD_MIGRATE_IMAGE: ${{ needs.publish-amd64.outputs.migrate_image }}
        run: |
          set -euo pipefail

          publish_manifest() {
            local image="$1" arm_image="$2" amd_image="$3" tag
            local -a tags=()
            while IFS= read -r tag; do
              tags+=(--tag "$tag")
            done < <(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' <<< "$METADATA_JSON")

            docker buildx imagetools create "${tags[@]}" "$arm_image" "$amd_image"
            for ((i=1; i<${#tags[@]}; i+=2)); do
              tag="${tags[$i]}"
              docker buildx imagetools inspect --raw "$tag" |
                jq -e '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
              echo "- \`$tag\`: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
            done
          }

          publish_manifest "$REGISTRY/$APP_IMAGE_NAME" "$ARM_APP_IMAGE" "$AMD_APP_IMAGE"
          publish_manifest "$REGISTRY/$MIGRATE_IMAGE_NAME" "$ARM_MIGRATE_IMAGE" "$AMD_MIGRATE_IMAGE"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, publish]
    runs-on: ubuntu-24.04-arm
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
      # Preserve pending releases when builds finish out of commit order.
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check current main revision
        id: revision
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          # Image builds can finish out of order; only current main may deploy.
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale revision $GITHUB_SHA; main is $main_sha"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.revision.outputs.deploy == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified images
        if: steps.revision.outputs.deploy == 'true'
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:sha-${{ github.sha }}
          MIGRATE_IMAGE: ${{ needs.publish.outputs.migrate_image }}
        run: |
          docker buildx imagetools create --tag "$REGISTRY/$APP_IMAGE_NAME:latest" "$APP_IMAGE"
          docker buildx imagetools create --tag "$REGISTRY/$MIGRATE_IMAGE_NAME:latest" "$MIGRATE_IMAGE"

      - name: Configure SSH
        if: steps.revision.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts

      - name: Deploy release
        if: steps.revision.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:sha-${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATE_IMAGE: ${{ needs.publish.outputs.migrate_image }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          cat docker-compose.deploy.yml | ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/docker-compose.deploy.yml'"
          cat scripts/deploy-release.sh | ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$DEPLOY_PATH/deploy-release.sh' && chmod +x '$DEPLOY_PATH/deploy-release.sh'"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && KLEIS_APP_IMAGE='$APP_IMAGE' KLEIS_MIGRATE_IMAGE='$MIGRATE_IMAGE' ./deploy-release.sh"
