x-app: &app
  image: ${KLEIS_APP_IMAGE:?set KLEIS_APP_IMAGE}
  env_file:
    - path: .env
      required: false
  init: true
  restart: unless-stopped
  # Long enough for in-flight model streams to finish while draining.
  stop_grace_period: 15m
  healthcheck:
    test:
      [
        "CMD",
        "bun",
        "-e",
        "fetch('http://127.0.0.1:3003/healthz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  migrate:
    image: ${KLEIS_MIGRATE_IMAGE:?set KLEIS_MIGRATE_IMAGE}
    env_file:
      - path: .env
        required: false
    restart: "no"

  # Blue/green pair: scripts/deploy-release.sh starts the idle one, waits for
  # it to pass health checks, then drains the other. Caddy proxies to both
  # ports and only routes to healthy ones.
  app-blue:
    <<: *app
    container_name: kleis-blue
    ports:
      - "127.0.0.1:3003:3003"

  app-green:
    <<: *app
    container_name: kleis-green
    ports:
      - "127.0.0.1:3004:3003"
