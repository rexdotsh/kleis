pre-commit:
  jobs:
    - run: bun fix
      glob:
        - "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
        - "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
        - "*.{json,jsonc,json5,css,html,webmanifest}"
        - "**/*.{json,jsonc,json5,css,html,webmanifest}"
        - "*.{yml,yaml,toml,graphql,gql}"
        - "**/*.{yml,yaml,toml,graphql,gql}"
      stage_fixed: true
